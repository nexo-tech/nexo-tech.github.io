{{- with .Params.asciinema -}}
  {{- $src := .src -}}
  {{- $cast := $.Resources.GetMatch $src -}}
  {{- if $cast -}}
    {{- $id := printf "asciinema-%s" ($.Title | anchorize) -}}
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/asciinema-player@latest/dist/bundle/asciinema-player.css">
    <section class="asciinema-hero" aria-label="{{ .label | default "Terminal recording" }}">
      <div id="{{ $id }}" class="asciinema-hero__player" data-cast-src="{{ $cast.RelPermalink }}">
        <div class="asciinema-hero__fallback">
          <span class="asciinema-hero__dot"></span>
          <span>Loading terminal recording...</span>
        </div>
      </div>
    </section>
    <script>
      window.agentpackAsciinemaInit = window.agentpackAsciinemaInit || function () {
        document.querySelectorAll("[data-cast-src]").forEach(function (mount) {
          if (mount.dataset.asciinemaReady) return;

          if (!window.AsciinemaPlayer) {
            mount.innerHTML = '<div class="asciinema-hero__fallback">Unable to load terminal player.</div>';
            return;
          }

          mount.dataset.asciinemaReady = "true";
          mount.innerHTML = "";

          try {
            window.AsciinemaPlayer.create(mount.dataset.castSrc, mount, {
              fit: "width",
              preload: true,
              cols: {{ .cols | default 109 }},
              rows: {{ .rows | default 14 }},
              autoPlay: {{ .autoPlay | default false }},
              loop: {{ .loop | default false }},
              poster: {{ printf "%q" (.poster | default "npt:0:03") | safeJS }},
              speed: {{ .speed | default 1 }},
              idleTimeLimit: {{ .idleTimeLimit | default 2 }},
              theme: {{ printf "%q" (.theme | default "asciinema") | safeJS }}
            });
          } catch (error) {
            console.error("Failed to create Asciinema player", error);
            mount.innerHTML = '<div class="asciinema-hero__fallback">Unable to play terminal recording.</div>';
          }
        });
      };

      window.agentpackAsciinemaLoadError = window.agentpackAsciinemaLoadError || function () {
        document.querySelectorAll("[data-cast-src]").forEach(function (mount) {
          mount.innerHTML = '<div class="asciinema-hero__fallback">Unable to load terminal player.</div>';
        });
      };

      if (window.AsciinemaPlayer) {
        window.agentpackAsciinemaInit();
      }
    </script>
    <script
      src="https://cdn.jsdelivr.net/npm/asciinema-player@latest/dist/bundle/asciinema-player.min.js"
      onload="window.agentpackAsciinemaInit && window.agentpackAsciinemaInit()"
      onerror="window.agentpackAsciinemaLoadError && window.agentpackAsciinemaLoadError()">
    </script>
    <script>
      window.setTimeout(function () {
        if (window.AsciinemaPlayer) {
          window.agentpackAsciinemaInit();
        } else {
          const mount = document.getElementById({{ printf "%q" $id | safeJS }});
          if (mount && !mount.dataset.asciinemaReady) {
            mount.innerHTML = '<div class="asciinema-hero__fallback">Unable to load terminal player.</div>';
          }
        }
      }, 3000);
    </script>
  {{- end -}}
{{- end -}}
