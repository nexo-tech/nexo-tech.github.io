<svg viewBox="0 0 520 100" xmlns="http://www.w3.org/2000/svg" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, monospace">
  <rect width="520" height="100" fill="#fff"/>

  <text x="10" y="14" font-size="7" fill="#57606a">&gt; WHEN NOT TO USE SERVERLESS</text>

  <!-- Question 1 -->
  <text x="10" y="40" font-size="8" fill="#2b2b2b">&gt;15 min?</text>
  <line x1="58" y1="36" x2="78" y2="36" stroke="#2b2b2b" stroke-width="1.2"/>
  <polygon points="78,36 73,33 73,39" fill="#2b2b2b"/>
  <text x="66" y="32" font-size="6" fill="#57606a">Yes</text>
  <rect x="82" y="26" width="60" height="20" rx="2" fill="none" stroke="#2b2b2b" stroke-width="1"/>
  <text x="112" y="39" text-anchor="middle" font-size="7" fill="#2b2b2b">Fargate/EC2</text>

  <!-- Arrow down from Q1 -->
  <line x1="34" y1="46" x2="34" y2="58" stroke="#2b2b2b" stroke-width="1.2"/>
  <polygon points="34,58 31,53 37,53" fill="#2b2b2b"/>
  <text x="40" y="54" font-size="6" fill="#57606a">No</text>

  <!-- Question 2 -->
  <text x="10" y="76" font-size="8" fill="#2b2b2b">High load?</text>
  <line x1="68" y1="72" x2="88" y2="72" stroke="#2b2b2b" stroke-width="1.2"/>
  <polygon points="88,72 83,69 83,75" fill="#2b2b2b"/>
  <text x="76" y="68" font-size="6" fill="#57606a">Yes</text>
  <rect x="92" y="62" width="60" height="20" rx="2" fill="none" stroke="#2b2b2b" stroke-width="1"/>
  <text x="122" y="75" text-anchor="middle" font-size="7" fill="#2b2b2b">Containers</text>

  <!-- Arrow right from Q2 -->
  <line x1="152" y1="72" x2="172" y2="72" stroke="#2b2b2b" stroke-width="1.2"/>
  <polygon points="172,72 167,69 167,75" fill="#2b2b2b"/>
  <text x="160" y="68" font-size="6" fill="#57606a">No</text>

  <!-- Question 3 -->
  <text x="176" y="76" font-size="8" fill="#2b2b2b">GPU?</text>
  <line x1="204" y1="72" x2="224" y2="72" stroke="#2b2b2b" stroke-width="1.2"/>
  <polygon points="224,72 219,69 219,75" fill="#2b2b2b"/>
  <text x="212" y="68" font-size="6" fill="#57606a">Yes</text>
  <rect x="228" y="62" width="72" height="20" rx="2" fill="none" stroke="#2b2b2b" stroke-width="1"/>
  <text x="264" y="75" text-anchor="middle" font-size="7" fill="#2b2b2b">EC2/SageMaker</text>

  <!-- Arrow right from Q3 -->
  <line x1="300" y1="72" x2="320" y2="72" stroke="#f97316" stroke-width="1.2"/>
  <polygon points="320,72 315,69 315,75" fill="#f97316"/>
  <text x="308" y="68" font-size="6" fill="#57606a">No</text>

  <!-- Result - Orange highlight -->
  <rect x="324" y="62" width="90" height="20" rx="2" fill="#f97316" stroke="#f97316" stroke-width="1"/>
  <text x="369" y="75" text-anchor="middle" font-size="8" fill="#fff" font-weight="600">Serverless</text>
</svg>
