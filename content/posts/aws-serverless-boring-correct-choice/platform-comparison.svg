<svg viewBox="0 0 540 110" xmlns="http://www.w3.org/2000/svg" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, monospace">
  <rect width="540" height="110" fill="#fff"/>

  <text x="10" y="14" font-size="7" fill="#57606a">&gt; PLATFORM COMPARISON</text>

  <!-- Headers -->
  <text x="140" y="30" font-size="7" fill="#57606a" text-anchor="middle">Memory</text>
  <text x="200" y="30" font-size="7" fill="#57606a" text-anchor="middle">Timeout</text>
  <text x="270" y="30" font-size="7" fill="#57606a" text-anchor="middle">Queues</text>
  <text x="340" y="30" font-size="7" fill="#57606a" text-anchor="middle">Cron</text>
  <text x="410" y="30" font-size="7" fill="#57606a" text-anchor="middle">DB</text>
  <text x="490" y="30" font-size="7" fill="#57606a" text-anchor="middle">Best for</text>

  <!-- Vercel Row -->
  <rect x="10" y="38" width="70" height="20" rx="2" fill="#2b2b2b" stroke="#2b2b2b" stroke-width="1"/>
