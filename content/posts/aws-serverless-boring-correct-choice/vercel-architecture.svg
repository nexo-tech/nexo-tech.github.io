<svg viewBox="0 0 560 85" xmlns="http://www.w3.org/2000/svg" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, monospace">
  <rect width="560" height="85" fill="#fff"/>

  <!-- VERCEL section border -->
  <rect x="70" y="12" width="280" height="58" rx="2" fill="none" stroke="#2b2b2b" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="80" y="8" font-size="7" fill="#57606a">VERCEL</text>

  <!-- Browser -->
  <text x="12" y="20" font-size="8" fill="#57606a">&gt; CLIENT</text>
  <rect x="12" y="28" width="50" height="22" rx="2" fill="none" stroke="#2b2b2b" stroke-width="1.2"/>
  <text x="37" y="42" text-anchor="middle" font-size="8" fill="#2b2b2b">Browser</text>

  <!-- Arrow to CDN -->
  <line x1="62" y1="39" x2="78" y2="39" stroke="#2b2b2b" stroke-width="1.2"/>
  <polygon points="78,39 73,36 73,42" fill="#2b2b2b"/>

  <!-- Vercel CDN -->
  <rect x="82" y="28" width="60" height="22" rx="2" fill="#2b2b2b" stroke="#2b2b2b" stroke-width="1.2"/>
  <text x="112" y="42" text-anchor="middle" font-size="8" fill="#fff">Vercel CDN</text>

  <!-- Arrow to Next.js -->
  <line x1="142" y1="39" x2="158" y2="39" stroke="#2b2b2b" stroke-width="1.2"/>
  <polygon points="158,39 153,36 153,42" fill="#2b2b2b"/>

  <!-- Next.js -->
  <rect x="162" y="28" width="56" height="22" rx="2" fill="#2b2b2b" stroke="#2b2b2b" stroke-width="1.2"/>
  <text x="190" y="42" text-anchor="middle" font-size="8" fill="#fff">Next.js</text>

  <!-- Arrow to API Routes -->
  <line x1="218" y1="39" x2="234" y2="39" stroke="#2b2b2b" stroke-width="1.2"/>
  <polygon points="234,39 229,36 229,42" fill="#2b2b2b"/>

  <!-- API Routes -->
  <rect x="238" y="28" width="100" height="22" rx="2" fill="none" stroke="#2b2b2b" stroke-width="1.2"/>
  <text x="288" y="42" text-anchor="middle" font-size="8" fill="#2b2b2b">API Routes</text>

  <!-- BACKEND section - Orange highlight -->
  <text x="380" y="20" font-size="8" fill="#f97316">&gt; BACKEND (AWS)</text>

  <!-- Arrow to backend - Orange -->
  <line x1="338" y1="39" x2="378" y2="39" stroke="#f97316" stroke-width="1.2"/>
  <polygon points="378,39 373,36 373,42" fill="#f97316"/>

  <!-- K8s / AWS - Orange border -->
  <rect x="382" y="28" width="70" height="22" rx="2" fill="none" stroke="#f97316" stroke-width="1.2"/>
  <text x="417" y="42" text-anchor="middle" font-size="8" fill="#f97316">K8s / AWS</text>

  <!-- Queue -->
  <rect x="456" y="28" width="44" height="22" rx="2" fill="none" stroke="#f97316" stroke-width="1.2"/>
  <text x="478" y="42" text-anchor="middle" font-size="8" fill="#f97316">Queue</text>

  <!-- Database -->
  <rect x="504" y="28" width="44" height="22" rx="2" fill="none" stroke="#f97316" stroke-width="1.2"/>
  <text x="526" y="42" text-anchor="middle" font-size="8" fill="#f97316">DB</text>
</svg>
